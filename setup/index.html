<!DOCTYPE html>
<html lang="en">
<head>
  <title>PC Setup</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css" />

  <style>
    html, body { background: #0d1117; }
    body { margin: 0; padding: 30px 15px; }

    .markdown-body {
      max-width: 850px;
      margin: 0 auto;
      padding: 0;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 17px;
      margin-right: 4px;
      vertical-align: -3px;
      flex-shrink: 0;
    }
    .icon svg { display: block; width: 17px; height: 17px; }
  </style>
</head>
<body>
  <main class="markdown-body" id="app"></main>

  <script>
    const ICON_BASE = "https://raw.githubusercontent.com/lucide-icons/lucide/main/icons";
    const ICON_COLOR = "#e6edf3";
    const ICON_SIZE = 17;

    const sections = [
      {
        title: "PC Specs",
        items: [
          ["cpu", "CPU", "Intel Core i5-12400F"],
          ["gpu", "GPU", "ASRock AMD Radeon RX 6600 Challenger D 8GB"],
          ["circuit-board", "Motherboard", "MSI PRO H610M-E DDR4"],
          ["memory-stick", "RAM", "Kingston FURY Beast 32GB (2x16GB) DDR4 3200MHz CL16"],
          ["hard-drive", "Storage", "ADATA LEGEND 800 M.2 SSD 1TB"],
          ["snowflake", "Cooler", "Endorfy Spartan 5 MAX ARGB"],
          ["zap", "PSU", "EVGA SuperNOVA 750 P2 (750W 80 PLUS Platinum)"],
          ["fan", "Fans", "3x Arctic P12 PWM PST ARGB"],
          ["box", "Case", "ADATA XPG STARKER AIR"]
        ]
      },
      {
        title: "Peripherals",
        items: [
          ["monitor", "Monitor", '27" LG UltraGear 27GS75Q-B'],
          ["mouse", "Mouse", "Glorious Model D Wireless"],
          ["keyboard", "Keyboard", "Genesis Thor 404 TKL"],
          ["keyboard", "Keyboard", "Royal Kludge R75"],
          ["headphones", "Headset", "SteelSeries Arctis 1 Wired"],
          ["mic", "Microphone", "FIFINE A6NEO"]
        ]
      }
    ];

    function createIcon(name) {
      const span = document.createElement("span");
      span.className = "icon";
      span.setAttribute("aria-hidden", "true");

      fetch(`${ICON_BASE}/${name}.svg`)
        .then(r => r.text())
        .then(svg => {
          svg = svg
            .replace(/stroke="currentColor"/g, `stroke="${ICON_COLOR}"`)
            .replace(/width="24"\s+height="24"/, `width="${ICON_SIZE}" height="${ICON_SIZE}"`);
          const wrapper = document.createElement("span");
          wrapper.innerHTML = svg;
          span.appendChild(wrapper.firstElementChild);
        })
        .catch(() => { /* fallback: leave empty */ });

      return span;
    }

    function render() {
      const frag = document.createDocumentFragment();

      sections.forEach((section, i) => {
        if (i > 0) frag.appendChild(document.createElement("hr"));

        const h2 = document.createElement("h2");
        h2.textContent = section.title;
        frag.appendChild(h2);

        const ul = document.createElement("ul");
        section.items.forEach(([icon, label, value]) => {
          const li = document.createElement("li");
          li.appendChild(createIcon(icon));
          const strong = document.createElement("strong");
          strong.textContent = `${label}:`;
          li.appendChild(strong);
          li.appendChild(document.createTextNode(` ${value}`));
          ul.appendChild(li);
        });
        frag.appendChild(ul);
      });

      document.getElementById("app").appendChild(frag);
    }

    render();
  </script>
</body>
</html>
